<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0518" />
  <title>Basketball Runs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hud hidden">
    <div class="score-display">
      <span class="score-label">SCORE</span>
      <span id="score">0</span>
    </div>
    <div class="coin-display">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="#ffcc33" stroke="#9a6800" stroke-width="2"/>
        <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="900" fill="#9a6800">$</text>
      </svg>
      <span id="coins-hud">0</span>
    </div>
  </div>

  <!-- Start menu -->
  <div id="menu" class="overlay">
    <div class="logo">
      <div class="logo-circle">
        <svg viewBox="0 0 100 100" width="120" height="120" aria-hidden="true">
          <circle cx="50" cy="50" r="46" fill="#ff6b1a" stroke="#1a0a00" stroke-width="3" />
          <path d="M 4 50 Q 50 50 96 50" stroke="#1a0a00" stroke-width="3" fill="none" />
          <path d="M 50 4 Q 50 50 50 96" stroke="#1a0a00" stroke-width="3" fill="none" />
          <path d="M 14 18 Q 50 50 86 18" stroke="#1a0a00" stroke-width="3" fill="none" />
          <path d="M 14 82 Q 50 50 86 82" stroke="#1a0a00" stroke-width="3" fill="none" />
        </svg>
      </div>
      <h1>BASKETBALL<br /><span>RUNS</span></h1>
    </div>

    <div class="menu-coin-bar">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="#ffcc33" stroke="#9a6800" stroke-width="2"/>
        <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="900" fill="#9a6800">$</text>
      </svg>
      <span id="coins-menu">0</span>
    </div>

    <button id="play-btn" class="btn">PLAY</button>
    <button id="shop-btn" class="btn btn-secondary">SHOP</button>

    <div class="instructions">
      <div class="row"><span class="swipe">&#8592;</span> Crossover</div>
      <div class="row"><span class="swipe">&#8594;</span> Behind-the-back</div>
      <div class="row"><span class="swipe">&#8593;</span> Jump / Dunk</div>
      <div class="row"><span class="swipe">&#8595;</span> Slide</div>
    </div>
    <div class="hint">Swipe on phone &middot; Arrow keys / WASD on desktop</div>
  </div>

  <!-- Shop -->
  <div id="shop" class="overlay shop-overlay hidden">
    <div class="shop-header">
      <button id="shop-back" class="icon-btn" aria-label="Back">&#8592;</button>
      <h2 class="shop-title">SKINS</h2>
      <div class="shop-coins">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="#ffcc33" stroke="#9a6800" stroke-width="2"/>
          <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="900" fill="#9a6800">$</text>
        </svg>
        <span id="coins-shop">0</span>
      </div>
    </div>

    <div class="shop-stage">
      <button id="shop-prev" class="shop-nav" aria-label="Previous skin">&#8249;</button>
      <div id="shop-preview-wrap" class="shop-preview-wrap">
        <div id="shop-rarity" class="shop-rarity-badge common">COMMON</div>
        <canvas id="shop-preview" class="shop-preview-canvas"></canvas>
        <div id="shop-locked-overlay" class="shop-locked-overlay hidden">
          <svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true">
            <path d="M6 10V8a6 6 0 1 1 12 0v2h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Zm2 0h8V8a4 4 0 0 0-8 0v2Z" fill="#ffcc33"/>
          </svg>
        </div>
      </div>
      <button id="shop-next" class="shop-nav" aria-label="Next skin">&#8250;</button>
    </div>

    <div class="shop-info">
      <div id="shop-skin-name" class="shop-name">Rookie</div>
      <div id="shop-dots" class="shop-dots"></div>
    </div>

    <div class="shop-footer">
      <button id="shop-action-btn" class="btn">EQUIPPED</button>
    </div>
  </div>

  <!-- Game over -->
  <div id="gameover" class="overlay hidden">
    <h2>GAME OVER</h2>
    <div class="final-score">
      <div>SCORE</div>
      <div id="final-score-val">0</div>
    </div>
    <div class="coins-earned">
      +<span id="coins-earned-val">0</span>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="vertical-align:-3px">
        <circle cx="12" cy="12" r="10" fill="#ffcc33" stroke="#9a6800" stroke-width="2"/>
        <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="900" fill="#9a6800">$</text>
      </svg>
    </div>
    <div class="high-score">Best: <span id="high-score-val">0</span></div>
    <button id="retry-btn" class="btn">RETRY</button>
    <button id="gameover-menu-btn" class="btn btn-secondary">MENU</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
